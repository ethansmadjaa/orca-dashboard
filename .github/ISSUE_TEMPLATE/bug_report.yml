name: Bug report
description: Something in the dashboard is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the dashboard with `bun run dev`
        2. …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `bun --version` and `orca --version`, plus your OS.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output or browser console errors. Redact anything private.
      render: shell
